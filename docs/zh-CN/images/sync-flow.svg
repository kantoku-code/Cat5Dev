<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
  </defs>
  <rect width="820" height="660" fill="#FFFFFF"/>

  <!-- ===== Pull ===== -->
  <text x="200" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A365D">Pull（CATIA → VSCode）</text>

  <rect x="50" y="60" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">检查未保存的编辑</text>
  <text x="200" y="108" text-anchor="middle" font-size="12" fill="#4A5568">modules/ 中有未保存的文件时中止</text>
  <line x1="200" y1="124" x2="200" y2="148" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="150" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">从 CATIA 获取模块</text>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#4A5568">标准模块 / 类模块 / 用户窗体</text>
  <line x1="200" y1="214" x2="200" y2="238" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="240" width="300" height="80" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="200" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">仅存在于本地的文件</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#4A5568">确认对话框：删除 / 保留</text>
  <text x="200" y="306" text-anchor="middle" font-size="12" fill="#4A5568">关闭对话框则取消 Pull</text>
  <line x1="200" y1="320" x2="200" y2="344" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="346" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">写入 modules/</text>
  <text x="200" y="394" text-anchor="middle" font-size="12" fill="#4A5568">仅限内容有变化的文件，写入前先备份</text>
  <line x1="200" y1="410" x2="200" y2="434" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="436" width="300" height="64" rx="8" fill="#EAF6EE" stroke="#2F855A" stroke-width="1.5"/>
  <text x="200" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">完成</text>
  <text x="200" y="484" text-anchor="middle" font-size="12" fill="#4A5568">失败时从备份恢复原状</text>

  <!-- ===== Push ===== -->
  <text x="610" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A365D">Push（VSCode → CATIA）</text>

  <rect x="460" y="60" width="300" height="64" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">检查未保存的编辑</text>
  <text x="610" y="108" text-anchor="middle" font-size="12" fill="#4A5568">如有则警告（继续时发送已保存的内容）</text>
  <line x1="610" y1="124" x2="610" y2="148" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="150" width="300" height="64" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">检查模块名称</text>
  <text x="610" y="198" text-anchor="middle" font-size="12" fill="#4A5568">超过 31 个字符时警告 / 不可用或重复时报错</text>
  <line x1="610" y1="214" x2="610" y2="238" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="240" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="610" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">与 CATIA 的当前内容比较</text>
  <text x="610" y="288" text-anchor="middle" font-size="12" fill="#4A5568">只发送有更改或新增的模块</text>
  <line x1="610" y1="304" x2="610" y2="328" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="330" width="300" height="80" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">仅存在于 CATIA 的模块</text>
  <text x="610" y="378" text-anchor="middle" font-size="12" fill="#4A5568">确认对话框：删除 / 保留</text>
  <text x="610" y="396" text-anchor="middle" font-size="12" fill="#4A5568">关闭对话框则取消 Push</text>
  <line x1="610" y1="410" x2="610" y2="434" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="436" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="610" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">写入 CATIA</text>
  <text x="610" y="484" text-anchor="middle" font-size="12" fill="#4A5568">跳过 CATIA 中不存在的 UserForm</text>
  <line x1="610" y1="500" x2="610" y2="524" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="526" width="300" height="64" rx="8" fill="#FFF4E5" stroke="#C05621" stroke-width="2"/>
  <text x="610" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B341E">在 CATIA 的 VBA 编辑器中保存</text>
  <text x="610" y="574" text-anchor="middle" font-size="12" fill="#7B341E">需手动执行（不会自动保存）</text>

  <!-- Legend -->
  <rect x="50" y="618" width="18" height="14" rx="3" fill="#EAF2FB" stroke="#2B6CB0"/>
  <text x="76" y="630" font-size="12" fill="#4A5568">自动执行的处理</text>
  <rect x="200" y="618" width="18" height="14" rx="3" fill="#FFFBEA" stroke="#B7791F"/>
  <text x="226" y="630" font-size="12" fill="#4A5568">出现确认或警告的环节</text>
  <rect x="380" y="618" width="18" height="14" rx="3" fill="#FFF4E5" stroke="#C05621"/>
  <text x="406" y="630" font-size="12" fill="#4A5568">由用户执行的操作</text>
</svg>
