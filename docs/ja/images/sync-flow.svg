<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="'Segoe UI', Meiryo, 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
  </defs>
  <rect width="820" height="660" fill="#FFFFFF"/>

  <!-- ===== Pull ===== -->
  <text x="200" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A365D">Pull（CATIA → VSCode）</text>

  <rect x="50" y="60" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">未保存の編集を確認</text>
  <text x="200" y="108" text-anchor="middle" font-size="12" fill="#4A5568">modules/ に未保存のファイルがあれば中止</text>
  <line x1="200" y1="124" x2="200" y2="148" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="150" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">CATIA からモジュールを取得</text>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#4A5568">標準モジュール / クラス / ユーザーフォーム</text>
  <line x1="200" y1="214" x2="200" y2="238" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="240" width="300" height="80" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="200" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">ローカルにだけ有るファイル</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#4A5568">確認ダイアログ：削除する / 残す</text>
  <text x="200" y="306" text-anchor="middle" font-size="12" fill="#4A5568">ダイアログを閉じると Pull をキャンセル</text>
  <line x1="200" y1="320" x2="200" y2="344" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="346" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="200" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">modules/ に書き込み</text>
  <text x="200" y="394" text-anchor="middle" font-size="12" fill="#4A5568">内容が変わったファイルのみ・事前にバックアップ</text>
  <line x1="200" y1="410" x2="200" y2="434" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="436" width="300" height="64" rx="8" fill="#EAF6EE" stroke="#2F855A" stroke-width="1.5"/>
  <text x="200" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">完了</text>
  <text x="200" y="484" text-anchor="middle" font-size="12" fill="#4A5568">失敗した場合はバックアップから元に戻す</text>

  <!-- ===== Push ===== -->
  <text x="610" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A365D">Push（VSCode → CATIA）</text>

  <rect x="460" y="60" width="300" height="64" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">未保存の編集を確認</text>
  <text x="610" y="108" text-anchor="middle" font-size="12" fill="#4A5568">あれば警告（続行すると保存済みの内容を送信）</text>
  <line x1="610" y1="124" x2="610" y2="148" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="150" width="300" height="64" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">モジュール名を確認</text>
  <text x="610" y="198" text-anchor="middle" font-size="12" fill="#4A5568">31 文字超は警告 / 使えない名前・重複はエラー</text>
  <line x1="610" y1="214" x2="610" y2="238" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="240" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="610" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">CATIA の現在の内容と比較</text>
  <text x="610" y="288" text-anchor="middle" font-size="12" fill="#4A5568">変更・追加されたモジュールだけを送信</text>
  <line x1="610" y1="304" x2="610" y2="328" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="330" width="300" height="80" rx="8" fill="#FFFBEA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="610" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">CATIA にだけ有るモジュール</text>
  <text x="610" y="378" text-anchor="middle" font-size="12" fill="#4A5568">確認ダイアログ：削除する / 残す</text>
  <text x="610" y="396" text-anchor="middle" font-size="12" fill="#4A5568">ダイアログを閉じると Push をキャンセル</text>
  <line x1="610" y1="410" x2="610" y2="434" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="436" width="300" height="64" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="610" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">CATIA へ書き込み</text>
  <text x="610" y="484" text-anchor="middle" font-size="12" fill="#4A5568">CATIA に無い UserForm はスキップ</text>
  <line x1="610" y1="500" x2="610" y2="524" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="460" y="526" width="300" height="64" rx="8" fill="#FFF4E5" stroke="#C05621" stroke-width="2"/>
  <text x="610" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#7B341E">CATIA の VBA エディタで保存</text>
  <text x="610" y="574" text-anchor="middle" font-size="12" fill="#7B341E">手動で行う（自動では保存されません）</text>

  <!-- Legend -->
  <rect x="50" y="618" width="18" height="14" rx="3" fill="#EAF2FB" stroke="#2B6CB0"/>
  <text x="76" y="630" font-size="12" fill="#4A5568">自動で行う処理</text>
  <rect x="200" y="618" width="18" height="14" rx="3" fill="#FFFBEA" stroke="#B7791F"/>
  <text x="226" y="630" font-size="12" fill="#4A5568">確認・警告が出る場面</text>
  <rect x="380" y="618" width="18" height="14" rx="3" fill="#FFF4E5" stroke="#C05621"/>
  <text x="406" y="630" font-size="12" fill="#4A5568">利用者が行う操作</text>
</svg>
